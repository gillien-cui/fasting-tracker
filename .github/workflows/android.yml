name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  apk:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      # Generates android/ from app.json and the config plugins (it isn't committed).
      - run: npx expo prebuild --platform android --no-install
      # Release build signed with the debug key, which is fine for installing on your own phone.
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk fasting-tracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fasting-tracker-apk
          path: fasting-tracker.apk
      # Every push to main replaces the "latest" pre-release, so the newest APK has a fixed download link.
      - name: Publish latest APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest fasting-tracker.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest Android build" \
            --notes "Built from $GITHUB_SHA. Open this page on your phone and tap fasting-tracker.apk to install."
